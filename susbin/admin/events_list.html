<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../css/nav.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body{
            background: green;
            color: aliceblue;
        }
        h1{
            text-align: center;
        }
        .content{
            width: 30%;
            margin: auto;
            /* margin: 50px; */
            margin-top: 25px;
        }
        input{
            margin-left: 10px;
        }
        button{
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="../image/logo.jpg" class="logo">
        <ul>
            <li><a href="admin.html">Home</a></li>
            <li><a href="pointcode.html">Manage PointCode</a></li>
            <li><a href="events_list.html">Manage Event</a></li>
        </ul>
    </div>

    <div class="container mt-3"> 
        <h2>Event List</h2>
        <a href="create_event.html"><button>CREATE</button></a>
        <table class="table table-dark">
            <thead>
                <tr>
                    <th>S. No.</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Venue</th>
                    <th>Event Type</th>
                    <th>Detail</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="eventTableBody">
                <!-- Dynamic rows will be added here -->
            </tbody>
        </table>
    </div>

    <!-- Modal for editing/deleting event -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="eventModalLabel">Edit Event</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editEventForm">
                <input type="hidden" id="eventId">
                <div class="mb-3">
                    <label for="editTitle" class="form-label">Title</label>
                    <input type="text" class="form-control" id="editTitle" required>
                </div>
                <div class="mb-3">
                    <label for="editDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="editDate" required>
                </div>
                <div class="mb-3">
                    <label for="editStartTime" class="form-label">Start Time</label>
                    <input type="time" class="form-control" id="editStartTime" required>
                </div>
                <div class="mb-3">
                    <label for="editEndTime" class="form-label">End Time</label>
                    <input type="time" class="form-control" id="editEndTime" required>
                </div>
                <div class="mb-3">
                    <label for="editVenue" class="form-label">Venue</label>
                    <input type="text" class="form-control" id="editVenue" required>
                </div>
                <div class="mb-3">
                    <label for="editEventType" class="form-label">Event Type</label>
                    <input type="text" class="form-control" id="editEventType" required>
                </div>
                <div class="mb-3">
                    <label for="editDetail" class="form-label">Detail</label>
                    <textarea class="form-control" id="editDetail" rows="3" required></textarea>
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="deleteEventBtn">Delete Event</button>
            <button type="button" class="btn btn-primary" id="updateEventBtn">Update Event</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Firebase SDK imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9M81AhHyIy6gs1GBBZBUMv-y5SrThWAA",
            authDomain: "susbin-420d2.firebaseapp.com",
            databaseURL: "https://susbin-420d2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "susbin-420d2",
            storageBucket: "susbin-420d2.appspot.com",
            messagingSenderId: "896697035981",
            appId: "1:896697035981:web:f2f4168c3eb242361c0d84"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const eventTableBody = document.getElementById('eventTableBody');
        let currentEventId = "";

        // Fetch and display events
        async function loadEvents() {
            const eventSnapshot = await getDocs(collection(db, "events"));
            eventTableBody.innerHTML = ""; // Clear previous rows
            let eventCount = 1;
            eventSnapshot.forEach(doc => {
                const eventData = doc.data();
                const row = `
                    <tr>
                        <td>${eventCount++}</td>
                        <td>${eventData.title}</td>
                        <td>${eventData.date}</td>
                        <td>${eventData.startTime}</td>
                        <td>${eventData.endTime}</td>
                        <td>${eventData.venue}</td>
                        <td>${eventData.eventType}</td>
                        <td>${eventData.detail}</td>
                        <td><button class="btn btn-warning btn-sm edit-btn" data-id="${doc.id}" data-bs-toggle="modal" data-bs-target="#eventModal">Edit</button></td>
                    </tr>
                `;
                eventTableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Handle edit button click
        document.addEventListener('click', function(event) {
            if (event.target && event.target.classList.contains('edit-btn')) {
                currentEventId = event.target.getAttribute('data-id');
                loadEventData(currentEventId);
            }
        });

        // Load event data into the modal
        async function loadEventData(eventId) {
            const eventRef = doc(db, "events", eventId);
            const eventDoc = await getDoc(eventRef);
            if (eventDoc.exists()) {
                const eventData = eventDoc.data();
                document.getElementById('editTitle').value = eventData.title;
                document.getElementById('editDate').value = eventData.date;
                document.getElementById('editStartTime').value = eventData.startTime;
                document.getElementById('editEndTime').value = eventData.endTime;
                document.getElementById('editVenue').value = eventData.venue;
                document.getElementById('editEventType').value = eventData.eventType;
                document.getElementById('editDetail').value = eventData.detail;
            }
        }

        // Handle update event
        document.getElementById('updateEventBtn').addEventListener('click', async () => {
            const eventRef = doc(db, "events", currentEventId);
            const updatedData = {
                title: document.getElementById('editTitle').value,
                date: document.getElementById('editDate').value,
                startTime: document.getElementById('editStartTime').value,
                endTime: document.getElementById('editEndTime').value,
                venue: document.getElementById('editVenue').value,
                eventType: document.getElementById('editEventType').value,
                detail: document.getElementById('editDetail').value,
            };
            await updateDoc(eventRef, updatedData);
            alert("Event updated successfully!");
            const modal = bootstrap.Modal.getInstance(document.getElementById('eventModal'));
            modal.hide();
            loadEvents(); // Reload events
        });

        // Handle delete event
        document.getElementById('deleteEventBtn').addEventListener('click', async () => {
            const eventRef = doc(db, "events", currentEventId);
            await deleteDoc(eventRef);
            alert("Event deleted successfully!");
            const modal = bootstrap.Modal.getInstance(document.getElementById('eventModal'));
            modal.hide();
            loadEvents(); // Reload events
        });

        // Initial event load
        loadEvents();
    </script>
</body>
</html>
