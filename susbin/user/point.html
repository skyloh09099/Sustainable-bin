<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Code</title>
    <link rel="icon" type="image/jpg" href="../image/logo.jpg">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/user_point.css">
</head>
<body>
    <div class="navbar">
        <img src="../image/logo.jpg" class="logo">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="recycleInfo.html">Local Recycling Info</a></li>
            <li><a href="map.html">Find a Recycle Point</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="events.html">Event</a></li>
            <li><a href="user.html">Member</a></li>
        </ul>
    </div>

    <div class="content">
    <div class="container mt-5">
        <h1 id="remainingPoints">Remaining Points: Loading...</h1>
        <h2>Enter Claim Code</h2>
        <input type="text" id="claimCodeInput" placeholder="Enter claim code" class="form-control mb-3">
        <button id="claimBtn" class="btn btn-primary">Submit</button>
        <p id="resultMessage" class="mt-3"></p>
    </div>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB9M81AhHyIy6gs1GBBZBUMv-y5SrThWAA",
            authDomain: "susbin-420d2.firebaseapp.com",
            databaseURL: "https://susbin-420d2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "susbin-420d2",
            storageBucket: "susbin-420d2.appspot.com",
            messagingSenderId: "896697035981",
            appId: "1:896697035981:web:f2f4168c3eb242361c0d84"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore();

        // HTML Elements
        const claimCodeInput = document.getElementById("claimCodeInput");
        const claimBtn = document.getElementById("claimBtn");
        const resultMessage = document.getElementById("resultMessage");
        

        // Claim Button event
        claimBtn.addEventListener("click", async () => {
            const claimCode = claimCodeInput.value.trim();

            if (!claimCode) {
                resultMessage.textContent = "Please enter a claim code!";
                return;
            }

            try {
                const pointRef = collection(db, "point");
                const querySnapshot = await getDocs(pointRef);

                let claimPoint = 0;
                let validCodeFound = false;
                let docIdToDelete = null;

                querySnapshot.forEach(docSnap => {
                    const docData = docSnap.data();
                    // DISPLAY Document List in CONSOLE
                    // console.log(`ID: ${docSnap.id}, Point: ${docData.point}, Code: ${docData.code}`); // Debug: log document ID
                    if (docData.code == claimCode) {
                    // Get the point associated with this code
                        claimPoint = docData.point; 
                        validCodeFound = true;
                        docIdToDelete = docSnap.id;
                    }
                });

                if (!validCodeFound) {
                    console.log("No matching claim code found.");
                    resultMessage.textContent = "Invalid claim code.";
                    return;
                }
                const currentUserId = localStorage.getItem('loggedInUserId');

                if (!currentUserId) {
                    resultMessage.textContent = "Error: No user is logged in.";
                    return;
                }

                // Adjust to the correct collection name for your users
                const userRef = doc(db, "users", currentUserId);  
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    resultMessage.textContent = "User does not exist.";
                    return;
                }

                // Get the current user's points and add the claim points
                // Handle the case if no points exist
                const currentUserPoints = userSnap.data().point || 0;  
                const updatedPoints = currentUserPoints + claimPoint;

                // Delete the document by ID
                await deleteDoc(doc(db, "point", docIdToDelete));

                // Update Firestore
                await updateDoc(userRef, {
                    point: updatedPoints
                });

                resultMessage.textContent = `Claim successful! You've earned ${claimPoint} points. Your new total is ${updatedPoints} points.`;
                getUserPoints();
            } catch (error) {
                console.error("Error claiming points:", error);
                alert("Invalid Code");
                resultMessage.textContent = "An error occurred. Please try again.";
            }
        });

        async function getUserPoints() {
            const currentUserId = localStorage.getItem('loggedInUserId'); // Get the logged-in user ID from localStorage

            if (!currentUserId) {
                alert("User is not logged in.");
                return;
            }

            try {
                const userDocRef = doc(db, "users", currentUserId); // Reference to the current user's document
                const userDoc = await getDoc(userDocRef); // Fetch the user's document from Firestore

                if (userDoc.exists()) {
                    const userPoints = userDoc.data().point; // Get the user's current points
                    document.getElementById('remainingPoints').innerText = `Remaining Points: ${userPoints}`; // Display the points
                } else {
                    alert("User document not found.");
                }
            } catch (error) {
                console.error("Error fetching user points: ", error);
            }
        }

        getUserPoints();
    </script>
</body>
</html>
