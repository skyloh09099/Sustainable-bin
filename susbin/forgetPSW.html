<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" type="image/jpg" href="image/logo.jpg">
    <link rel="stylesheet" href="css/forgetPSW.css">
</head>
<body>
    <div class="row">
        <div class="container" id="signIn">
            <h1 class="form-title">Forgot Password?</h1>
            <form method="post" action="">
            <div id="signInMessage" class="messageDiv" style="display:none;"></div>

            <div class="input-group">
                <input type="email"  id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <p></p>
            <button>
                <label id="forgotpasslabel" style="cursor: pointer; margin-top: 8px; margin-left: 2px;">
                Submit
                </label>
            </button>

            </form>
            <p class="or">
            ----------or--------
            </p>

            <div class="links">
                <p>Already Have an Account? <a href="login.html">sign in</a></p>
                <p>Don't have an account? <a href="register.html">register now</a></p>
            </div>
        </div>

    </div>

      <script type="module">

        import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import {getAuth, sendPasswordResetEmail} 
        from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import{getFirestore, setDoc, doc} 
        from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js"

        const firebaseConfig = {
          apiKey: "AIzaSyB9M81AhHyIy6gs1GBBZBUMv-y5SrThWAA",
          authDomain: "susbin-420d2.firebaseapp.com",
          databaseURL: "https://susbin-420d2-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "susbin-420d2",
          storageBucket: "susbin-420d2.appspot.com",
          messagingSenderId: "896697035981",
          appId: "1:896697035981:web:f2f4168c3eb242361c0d84"
        };
        const app = initializeApp(firebaseConfig);
        const auth=getAuth();

        let ForgotPassLabel = document.getElementById('forgotpasslabel');
        let EmailInp = document.getElementById('email');

        let ForgotPassword = ()=>{
            sendPasswordResetEmail(auth,EmailInp.value)
            .then(()=>{
                alert("A Password Reset Link has been sent to your email");
            })
            .catch((error)=>{
                alert("Please Enter a Valid Email!");
                console.log(error.code);
                console.log(error.message);
            })
        }

        ForgotPassLabel.addEventListener('click',ForgotPassword);
        
    </script>
</body>
</html>
