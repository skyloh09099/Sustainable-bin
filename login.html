<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- <link rel="stylesheet" href="css/index_style.css"> -->
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/login_register.css">
    <link rel="icon" type="image/jpg" href="image/logo.jpg">
    <script type="module" src="js/firebase-auth-login.js"></script>
</head>
<body>
    <div class="navbar">
        <img src="image/logo.jpg" class="logo">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="recycleInfo.html">Local Recycling Info</a></li>
            <li><a href="map.html">Find a Recycle Point</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="events.html">Event</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>

    <div class="container" id="signIn">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="">
            <div id="signInMessage" class="messageDiv" style="display:none;"></div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <label for="email">EMAIL</label>
                <input type="email"  id="email" placeholder="Email" required>
            </div>

            <div class="input-group" class="PSW">
                <i class="fas fa-lock"></i>
                <label for="password">PASSWORD</label>
                <input type="password" id="password"  placeholder="Password" required>
            </div>

            <div>
                <label for="role">Role:</label>
                <select id="roles">
                    <!-- <option value="admin">Admin</option> -->
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <p class="recover">
                <a href="forgetPSW.html">Recover Password</a>
            </p>
            
            <button  class="btn"  id="submitSignIn">Sign In</button>
        </form>
        <p class="or">
            ----------or--------
        </p>

        <div class="links">
            <p>Don't have an account? <a href="register.html">register now</a></p>
        </div>
    </div>

</body>
</html>
