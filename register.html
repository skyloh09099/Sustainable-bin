<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script type="module" src="js/firebase-auth-register.js"></script>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/login_register.css">
    <link rel="icon" type="image/jpg" href="image/logo.jpg">
</head>
<body>
    <div class="navbar">
        <img src="image/logo.jpg" class="logo">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="recycleInfo.html">Local Recycling Info</a></li>
            <li><a href="map.html">Find a Recycle Point</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="events.html">Event</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>

    <div class="container" id="signup">
        <h1 class="form-title">Register</h1>
        <form method="post" action="">
            <div id="signUpMessage" class="messageDiv"></div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text"  id="fName" placeholder="Username" required>
                <label for="fname">USERNAME</label>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email"  id="rEmail" placeholder="Email" required>
                <label for="rEmail">EMAIL</label>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="rPassword"  placeholder="Password" required>
                <label for="rPassword">PASSWORD</label>
            </div>
            <button class="btn" id="submitSignUp" >Sign Up</button>
        </form>
        <p class="or">
            ----------or--------
        </p>

        <div class="links">
            <p>Already Have an Account? <a href="login.html">sign in</a></p>
        </div>
    </div>
</body>
</html>
